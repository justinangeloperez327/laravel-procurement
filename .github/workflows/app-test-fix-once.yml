name: app-test-fix-once

on:
  push:
    branches:
      - feat/annual-procurement-plan

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Match SQLite APP date storage in assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/Feature/Planning/AnnualProcurementPlanTest.php')
          text = path.read_text()
          text = text.replace("'schedule_start' => '2027-04-01',", "'schedule_start' => '2027-04-01 00:00:00',", 1)
          text = text.replace("'schedule_end' => '2027-06-01',", "'schedule_end' => '2027-06-01 00:00:00',", 1)
          path.write_text(text)
          PY

      - name: Commit test correction and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Feature/Planning/AnnualProcurementPlanTest.php
          git rm .github/workflows/app-test-fix-once.yml
          git commit -m "test: match APP schedule date storage"
          git push origin HEAD:feat/annual-procurement-plan
