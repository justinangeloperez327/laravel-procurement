name: app-test-normalize-once

on:
  push:
    branches:
      - feat/annual-procurement-plan

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make APP schedule assertions database agnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/Feature/Planning/AnnualProcurementPlanTest.php')
          text = path.read_text()
          text = text.replace("'schedule_start' => '2027-04-01 00:00:00',", "'schedule_start' => '2027-04-01',", 1)
          text = text.replace("'schedule_end' => '2027-06-01 00:00:00',", "'schedule_end' => '2027-06-01',", 1)
          text = text.replace(
              "        'schedule_start' => '2027-04-01',\n        'schedule_end' => '2027-06-01',\n        'estimated_budget' => 500000,",
              "        'estimated_budget' => 500000,",
              1,
          )
          text = text.replace(
              "    expect($plan->items()->firstOrFail()->procurement_strategy_tools)\n        ->toBe(['Framework Agreement', 'Pooled Procurement']);",
              "    $storedItem = $plan->items()->firstOrFail();\n\n    expect($storedItem->schedule_start?->toDateString())->toBe('2027-04-01')\n        ->and($storedItem->schedule_end?->toDateString())->toBe('2027-06-01')\n        ->and($storedItem->procurement_strategy_tools)\n        ->toBe(['Framework Agreement', 'Pooled Procurement']);",
              1,
          )
          path.write_text(text)
          PY

      - name: Commit test correction and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Feature/Planning/AnnualProcurementPlanTest.php
          git rm .github/workflows/app-test-normalize-once.yml
          git commit -m "test: assert APP schedule through date casts"
          git push origin HEAD:feat/annual-procurement-plan
