name: format-procurement-activities-once

on:
  push:
    branches:
      - feat/procurement-activities
    paths:
      - .github/workflows/format-procurement-activities-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Format
        run: npx oxfmt --write resources/js/pages/procurement/activities/index.tsx

      - name: Commit formatted page and remove helper
        run: |
          rm .github/workflows/format-procurement-activities-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/procurement/activities/index.tsx .github/workflows/format-procurement-activities-once.yml
          git commit -m "style: normalize procurement activity workspace"
          git push
