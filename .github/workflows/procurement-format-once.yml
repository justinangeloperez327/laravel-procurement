name: procurement-format-once

on:
  push:
    branches:
      - feat/procurement-project-initiation
    paths:
      - .github/workflows/procurement-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/procurement-project-initiation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npm run check -- --fix

      - name: Commit formatter output and remove helper
        run: |
          rm .github/workflows/procurement-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/components/procurement/procurement-project-form.tsx resources/js/pages/procurement/projects/index.tsx .github/workflows/procurement-format-once.yml
          git diff --cached --quiet || git commit -m "style: format procurement project UI"
          git push
