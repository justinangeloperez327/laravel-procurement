name: procurement-format-once

on:
  push:
    branches:
      - feat/procurement-project-initiation
    paths:
      - .github/workflows/procurement-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/procurement-project-initiation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Format procurement UI
        run: npx oxfmt --write resources/js/components/procurement/procurement-project-form.tsx resources/js/pages/procurement/projects/index.tsx

      - name: Commit formatting and remove helper workflow
        run: |
          rm .github/workflows/procurement-format-once.yml
          git config user.name "Clover"
          git config user.email "68591353+justinangeloperez327@users.noreply.github.com"
          git add resources/js/components/procurement/procurement-project-form.tsx resources/js/pages/procurement/projects/index.tsx .github/workflows/procurement-format-once.yml
          git commit -m "style: format procurement project UI"
          git push origin HEAD:feat/procurement-project-initiation
