name: pint-once

on:
  push:
    branches:
      - feat/ppmp-planning

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Format PPMP controller
        run: vendor/bin/pint app/Http/Controllers/Planning/PpmpController.php

      - name: Commit Pint output and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/Planning/PpmpController.php
          git rm .github/workflows/pint-once.yml
          git commit -m "style: format PPMP controller"
          git push origin HEAD:feat/ppmp-planning
