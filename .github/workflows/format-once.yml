name: format-once

on:
  push:
    branches:
      - feat/ppmp-planning

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Format target files
        run: |
          npm ci
          npm run check:fix

      - name: Commit formatter output and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/components/planning/ppmp-form.tsx resources/js/pages/planning/ppmps/index.tsx
          git rm .github/workflows/format-once.yml
          git commit -m "style: format PPMP frontend"
          git push origin HEAD:feat/ppmp-planning
