name: app-format-once

on:
  push:
    branches:
      - feat/annual-procurement-plan

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Format APP frontend
        run: |
          npm ci
          npm run check:fix

      - name: Commit formatter output and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/components/planning/annual-procurement-plan-form.tsx
          git add resources/js/pages/planning/annual-procurement-plans/create.tsx
          git add resources/js/pages/planning/annual-procurement-plans/edit.tsx
          git rm .github/workflows/app-format-once.yml
          git commit -m "style: format APP frontend"
          git push origin HEAD:feat/annual-procurement-plan
